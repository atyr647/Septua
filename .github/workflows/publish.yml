# Publishes a Septua release pushed to an upload/v<version> branch (by
# tools/publish-release.sh in Septua's source): a GitHub Release with the
# APK, then latest.json (what the app reads), then the branch is deleted so
# APKs don't stay in this repository's history.
name: Publish a release

on:
  push:
    branches: ['upload/v*']

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v=$(jq -r .version release.json)
          if [ "upload/v$v" != "$GITHUB_REF_NAME" ]; then
            echo "release.json says $v, but the branch is $GITHUB_REF_NAME"; exit 1
          fi
          apk="Septua-$v.apk"
          [ -s "$apk" ] || { echo "no $apk"; exit 1; }
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          jq -r .notes release.json > notes.md
          summary=$(jq -r .summary release.json)   # (release.json goes with the branch)
          printf '\n\nSHA-256 of `%s`: `%s`\n' "$apk" "$sum" >> notes.md

          gh release create "v$v" "$apk" --repo "$GITHUB_REPOSITORY" \
            --title "Septua $v" --notes-file notes.md --target main --latest

          # The download must work before the app is told about it.
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/$apk"
          for i in 1 2 3 4 5 6; do
            curl -sfIL -o /dev/null "$url" && break
            [ "$i" = 6 ] && { echo "the download doesn't answer: $url"; exit 1; }
            sleep 10
          done

          git fetch -q origin main
          git checkout -q -B main origin/main
          jq -n --arg v "$v" --arg n "$summary" --arg a "$url" \
                --arg p "https://github.com/$GITHUB_REPOSITORY/releases/latest" --arg s "$sum" \
                '{version: $v, notes: $n, android: $a, page: $p, sha256: $s}' > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -qm "Septua $v"
          git push -q origin main
          git push -q origin --delete "$GITHUB_REF_NAME"
