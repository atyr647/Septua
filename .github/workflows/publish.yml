# Publishes a Septua release pushed to an upload/v<version> branch (by
# tools/publish-release.sh in Septua's source): a GitHub Release with the
# APK and the Linux download, then latest.json (what the app reads), then
# the branch is deleted so downloads don't stay in this repository's history.
name: Publish a release

on:
  push:
    branches: ['upload/v*']

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v=$(jq -r .version release.json)
          if [ "upload/v$v" != "$GITHUB_REF_NAME" ]; then
            echo "release.json says $v, but the branch is $GITHUB_REF_NAME"; exit 1
          fi
          apk="Septua-$v.apk"
          linux="Septua-$v-linux-x86_64.tar.gz"
          [ -s "$apk" ] || { echo "no $apk"; exit 1; }
          [ -s "$linux" ] || { echo "no $linux"; exit 1; }
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          linux_sum=$(sha256sum "$linux" | cut -d' ' -f1)
          jq -r .notes release.json > notes.md
          summary=$(jq -r .summary release.json)   # (release.json goes with the branch)
          printf '\n\nSHA-256 of `%s`: `%s`\n' "$apk" "$sum" >> notes.md
          printf '\nSHA-256 of `%s`: `%s`\n' "$linux" "$linux_sum" >> notes.md

          gh release create "v$v" "$apk" "$linux" --repo "$GITHUB_REPOSITORY" \
            --title "Septua $v" --notes-file notes.md --target main --latest

          # The downloads must work before the app is told about them.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$v"
          url="$base/$apk"
          linux_url="$base/$linux"
          for u in "$url" "$linux_url"; do
            for i in 1 2 3 4 5 6; do
              curl -sfIL -o /dev/null "$u" && break
              [ "$i" = 6 ] && { echo "the download doesn't answer: $u"; exit 1; }
              sleep 10
            done
          done

          # The feed was made and signed by whoever published (apps believe a
          # feed only with a signature that checks); it must describe exactly
          # the files this release has.
          [ -s latest.json ] && [ -s latest.json.sig ] || { echo "the upload has no signed latest.json"; exit 1; }
          jq -e --arg v "$v" --arg s "$sum" --arg l "$linux_sum" \
            '.version == $v and .sha256 == $s and .linux_sha256 == $l' latest.json >/dev/null \
            || { echo "latest.json doesn't match the files"; exit 1; }
          cp latest.json latest.json.sig "$RUNNER_TEMP/"
          git fetch -q origin main
          git checkout -q -B main origin/main
          cp "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest.json.sig" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json latest.json.sig
          git commit -qm "Septua $v"
          git push -q origin main
          git push -q origin --delete "$GITHUB_REF_NAME"
